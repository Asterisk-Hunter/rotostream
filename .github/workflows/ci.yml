name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            ml/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: sam2.1-hiera-tiny-transformers-4.57.6
      - name: Install ffmpeg and OpenCV libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r api/requirements.txt -r ml/requirements.txt scikit-image
      - name: Contract, API, training and evaluation tests
        run: python -m pytest api/tests ml/tests --junitxml=reports/python-tests.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests
          path: reports/python-tests.xml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python, web]
    env:
      ROTOSTREAM_AUTH_USER: ci
      ROTOSTREAM_SMOKE_USER: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare temporary gateway credentials
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          hash=$(docker run --rm caddy:2.10-alpine caddy hash-password --plaintext "$password")
          echo "ROTOSTREAM_AUTH_HASH=$hash" >> "$GITHUB_ENV"
          echo "ROTOSTREAM_SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Audit API runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r api/requirements-runtime.txt --progress-spinner off
      - name: Build and start production stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify gateway protects UI, API, media and SSE
        run: |
          for path in / /api/health /api/videos/example/frames/0 /api/jobs/example/events; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            test "$status" = 401 || exit 1
          done
          curl --fail --silent -u "$ROTOSTREAM_AUTH_USER:$ROTOSTREAM_SMOKE_PASSWORD" http://127.0.0.1:8080/ > /dev/null
      - name: Real HTTP workflow through authenticated gateway
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install 'httpx>=0.27,<1'
          python api/scripts/smoke.py --base http://127.0.0.1:8080
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 100
      - name: Stop temporary stack
        if: always()
        run: docker compose down
