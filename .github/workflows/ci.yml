name: ci

on:
  push:
    branches: [main]
  pull_request:

# Minimal by design: tests and types only. No lint gate, no Docker, no torch
# install - torch-dependent tests skip themselves via pytest.importorskip, and
# ffmpeg-dependent tests skip when ffmpeg is absent. Docs target Windows; CI runs
# a POSIX python deliberately, so the suite has to pass in both.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            ml/requirements.txt

      # opencv-python (used by the baseline tracker) needs these two at import.
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt -r ml/requirements.txt

      - name: Tests
        run: python -m pytest api/tests ml/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir web exec tsc --noEmit
